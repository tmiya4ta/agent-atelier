http.port: "8081"

# /proxy で追加許可する host suffix (カンマ区切り)。 外部 A2A/MCP エージェントを足すとき設定。
# 既定の許可: *.mulesoft.com / *.cloudhub.io / *.amazonaws.com / salesforce / github / fonts / jsdelivr
proxy.allowHosts: ""

# /profiles への書き込み (アップロード/削除) に要るトークン。 空ならアップロード不可。
# CH2 では secure property (deployment の secureProperties) で渡す。
profiles.uploadToken: ""
